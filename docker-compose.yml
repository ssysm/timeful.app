version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:8
    container_name: timeful-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=schej-it
    networks:
      - timeful-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend (Go/Gin)
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: timeful-backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      # MongoDB connection
      - MONGODB_URI=mongodb://mongodb:27017
      - DATABASE_NAME=schej-it
      # Google OAuth
      - CLIENT_ID=${CLIENT_ID}
      - CLIENT_SECRET=${CLIENT_SECRET}
      - ANDROID_CLIENT_ID=${ANDROID_CLIENT_ID:-}
      - IOS_CLIENT_ID=${IOS_CLIENT_ID:-}
      # Google Cloud
      - SERVICE_ACCOUNT_KEY_PATH=${SERVICE_ACCOUNT_KEY_PATH:-}
      # Slack
      - SLACK_DEV_WEBHOOK_URL=${SLACK_DEV_WEBHOOK_URL:-}
      - SLACK_PROD_WEBHOOK_URL=${SLACK_PROD_WEBHOOK_URL:-}
      # Listmonk
      - LISTMONK_URL=${LISTMONK_URL:-}
      - LISTMONK_USERNAME=${LISTMONK_USERNAME:-}
      - LISTMONK_PASSWORD=${LISTMONK_PASSWORD:-}
      - LISTMONK_LIST_ID=${LISTMONK_LIST_ID:-}
      - LISTMONK_INITIAL_EMAIL_REMINDER_ID=${LISTMONK_INITIAL_EMAIL_REMINDER_ID:-}
      - LISTMONK_SECOND_EMAIL_REMINDER_ID=${LISTMONK_SECOND_EMAIL_REMINDER_ID:-}
      - LISTMONK_FINAL_EMAIL_REMINDER_ID=${LISTMONK_FINAL_EMAIL_REMINDER_ID:-}
      # Gmail
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD:-}
      - SCHEJ_EMAIL_ADDRESS=${SCHEJ_EMAIL_ADDRESS:-}
      # Security
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - SESSION_SECRET=${SESSION_SECRET}
      # Runtime
      - NODE_ENV=production
      - GIN_MODE=release
      - SKIP_FRONTEND_SERVE=true
      # Self-hosted mode
      - SELF_HOSTED_MODE=${SELF_HOSTED_MODE:-true}
      - REQUIRE_AUTH_FOR_EVENTS=${REQUIRE_AUTH_FOR_EVENTS:-false}
      - DISABLE_CLOUD_TASKS=${DISABLE_CLOUD_TASKS:-true}
    # volumes:
    #   # Mount service account key if provided
    #   - ${SERVICE_ACCOUNT_KEY_PATH:-/dev/null}:/app/service-account.json:ro
    networks:
      - timeful-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3002/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Frontend (Vue.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VUE_APP_POSTHOG_API_KEY=${VUE_APP_POSTHOG_API_KEY:-}
        - VUE_APP_GOOGLE_CLIENT_ID=${CLIENT_ID:-}
        - VUE_APP_OUTLOOK_CLIENT_ID=${MICROSOFT_CLIENT_ID:-}
        - VUE_APP_API_URL=/api
        - VUE_APP_SELF_HOSTED_MODE=${SELF_HOSTED_MODE:-true}
    container_name: timeful-frontend
    restart: unless-stopped
    networks:
      - timeful-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: timeful-nginx
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-80}:80"
      - "${HOST_SSL_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Uncomment for SSL certificates
      # - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - timeful-network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  timeful-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
